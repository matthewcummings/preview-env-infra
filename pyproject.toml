[project]
name = "preview-env-infra"
version = "0.1.0"
description = "Shared infra, the reconciler and CDK stacks for per-branch preview environments"
authors = [
    { name = "Matthew Cummings", email = "matthewcummings516@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.271.0",
    "boto3>=1.43.103",
    "constructs>=10.8.1",
    "pyyaml>=6.0.3",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv]
package = false
