# A service repo changed (push or delete of main/preview/*), or someone asked by hand:
# reconcile the env that branch belongs to (D8, D23, D26).
#
#   plan   learns which env this is and what would change (read-only)
#   apply  runs inside that env's queue and recomputes the plan fresh from GitHub and
#          CloudFormation. That's why GitHub dropping an older queued run is safe (D24):
#          whichever run goes last sees the latest branches.
name: Reconcile

on:
  repository_dispatch:
    types: [service-changed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to reconcile, e.g. preview/checkout/api or main"
        required: true
        type: string

permissions:
  contents: read

env:
  # Payload values are attacker-influenced (branch names): pass them via env vars, never
  # inline them into `run:` scripts.
  BRANCH: ${{ github.event.client_payload.branch || inputs.branch }}
  GITHUB_TOKEN: ${{ github.token }}  # GitHub API reads without the 60/h anonymous limit
  PREVIEW_ENV_GITHUB_OWNER: ${{ github.repository_owner }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      env: ${{ steps.plan.outputs.env }}
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Conflicts and other refusals fail here, loudly, and nothing is applied.
      - name: Plan
        id: plan
        run: >-
          uv run python -m reconciler plan --branch "$BRANCH"
          --github-output "$GITHUB_OUTPUT"
          --summary-file "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    # The plan job ran OUTSIDE the env's queue, so its answer can be stale: e.g. a branch
    # delete arriving while an earlier run is still creating the stack plans as `noop` (no
    # stack yet), and skipping it would leave an env with no branches. So queue every run
    # that might need to act, including noop and wait, and let the fresh plan inside the
    # queue decide. Skipped: ignored branches, and refused/error/unknown (the plan job
    # already failed or has nothing to act on). Later steps key off the apply step's own
    # action, so a fresh noop/wait does nothing else.
    if: >-
      contains(fromJSON('["create", "update", "destroy", "delete-then-create", "noop", "wait"]'),
      needs.plan.outputs.action)
    runs-on: ubuntu-24.04
    # One run per env at a time, across both service repos; at most one waits (D24).
    concurrency:
      group: preview-env-${{ needs.plan.outputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Apply
        id: apply
        run: >-
          uv run python -m reconciler apply --branch "$BRANCH"
          --spec-out envspec.json
          --github-output "$GITHUB_OUTPUT"
          --summary-file "$GITHUB_STEP_SUMMARY"

      # Smoke-test only what was (re)deployed; a teardown has nothing to test. The action
      # comes from the fresh plan inside the queue, not from the plan job.
      - name: Allow this runner's IP
        id: runner-ip
        if: contains(fromJSON('["create", "update", "delete-then-create"]'), steps.apply.outputs.action)
        run: |
          ip="$(curl -fsS https://checkip.amazonaws.com)"
          echo "cidr=${ip}/32" >> "$GITHUB_OUTPUT"
          uv run python scripts/allow_ip.py add --cidr "${ip}/32"

      - name: Smoke test
        id: smoke
        if: steps.runner-ip.outcome == 'success'
        env:
          ENV_NAME: ${{ steps.apply.outputs.env }}
        run: uv run python scripts/smoke_test.py "$ENV_NAME" --spec envspec.json

      - name: Remove this runner's IP
        if: always() && steps.runner-ip.outputs.cidr != ''
        env:
          CIDR: ${{ steps.runner-ip.outputs.cidr }}
        run: uv run python scripts/allow_ip.py remove --cidr "$CIDR"

      # Post the env URL as a sticky comment on the group's service-repo PRs (optional:
      # skipped inside the script if the PREVIEW_COMMENT_TOKEN secret isn't set). Runs even
      # if the smoke test failed, so the PR shows that too; never after a failed apply, and
      # never for main (no preview PRs). A failed comment never fails the run.
      - name: Comment on PRs
        if: >-
          always()
          && steps.apply.outcome == 'success'
          && steps.apply.outputs.env != 'main'
          && contains(fromJSON('["create", "update", "delete-then-create", "destroy"]'), steps.apply.outputs.action)
        # Belt and braces: the script already exits 0 on GitHub errors, but e.g. a failed URL
        # lookup must not turn a good deploy red either.
        continue-on-error: true
        env:
          PREVIEW_COMMENT_TOKEN: ${{ secrets.PREVIEW_COMMENT_TOKEN }}
          ENV_NAME: ${{ steps.apply.outputs.env }}
          ACTION: ${{ steps.apply.outputs.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE: ${{ steps.smoke.outcome == 'success' && 'passed' || steps.smoke.outcome == 'failure' && 'failed' || 'skipped' }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            uv run python scripts/pr_comment.py --group "$ENV_NAME" --action destroy \
              --run-url "$RUN_URL"
          else
            url="$(uv run python scripts/env_url.py "$ENV_NAME")"
            uv run python scripts/pr_comment.py --group "$ENV_NAME" --action "$ACTION" \
              --url "$url" --spec envspec.json --run-url "$RUN_URL" --smoke "$SMOKE"
          fi
